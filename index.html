<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>西安市消费补贴备注生成器</title>

<link rel="icon" type="image/png" sizes="32x32"
      href="https://woaiyhh.github.io/shibu/Pingu.png">

<link rel="apple-touch-icon" sizes="180x180"
      href="https://woaiyhh.github.io/shibu/Pingu.png">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif;
    background:#f5f5f5;
    padding:20px;
    color:#222;
}

.container{
    width:100%;
    max-width:500px;
    margin:auto;
    background:#fff;
    border-radius:12px;
    padding:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

h2{
    text-align:center;
    margin-bottom:20px;
}

label{
    display:block;
    margin:15px 0 6px;
    font-size:14px;
    color:#444;
}

input{
    width:100%;
    padding:11px;
    font-size:16px;
    border:1px solid #ccc;
    border-radius:6px;
    outline:none;
    transition:.2s;
}

input:focus{
    border-color:#28a745;
    box-shadow:0 0 0 2px rgba(40,167,69,.1);
}

.result,
.report-result{
    border:1px solid #ccc;
    border-radius:8px;
    padding:12px;
    white-space:pre-wrap;
    word-break:break-all;
    line-height:1.8;
    background:#fafafa;
    font-size:15px;
}

.result{
    min-height:180px;
    margin:20px 0;
}

.report-result{
    min-height:80px;
    margin:10px 0 20px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    background:#28a745;
    color:#fff;
    font-size:16px;
    border-radius:6px;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    background:#218838;
}

button:active{
    transform:scale(.98);
}

.success{
    text-align:center;
    color:#28a745;
    margin-top:10px;
    height:20px;
}

.tip{
    margin-top:15px;
    padding:10px;
    background:#f8f9fa;
    border-radius:6px;
    color:#666;
    font-size:12px;
    line-height:1.6;
}

.section-title{
    font-size:16px;
    font-weight:bold;
    margin-top:25px;
    margin-bottom:10px;
}

@media (max-width:600px){

    body{
        padding:10px;
    }

    .container{
        padding:15px;
    }

}

</style>

</head>

<body>

<div class="container">

<h2>西安市消费补贴备注生成器</h2>


<!-- 销售日期 -->

<label>销售日期</label>

<input
    type="date"
    id="date"
>


<!-- 手机型号 -->

<label>手机型号</label>

<input
    id="model"
    placeholder="请输入手机型号"
>


<!-- 原售价 -->

<label>原售价</label>

<input
    type="number"
    id="price"
    placeholder="请输入手机原售价"
    min="0"
    step="0.01"
>


<!-- 中台/小算盘售价 -->

<label>中台/小算盘售价</label>

<input
    type="number"
    id="middlePrice"
    placeholder="自动计算，可手动修改"
    min="0"
    step="0.01"
>


<!-- SN -->

<label>SN</label>

<input
    id="sn"
    placeholder="请输入SN"
>


<!-- 手机号 -->

<label>补贴确认人手机号</label>

<input
    id="phone"
    type="tel"
    placeholder="请输入手机号"
>


<!-- 地址 -->

<label>购买方地址</label>

<input
    id="address"
    placeholder="请输入购买方地址"
>


<!-- 最终备注 -->

<div class="result" id="result"></div>


<!-- 复制备注 -->

<button onclick="copyText()">
    复制备注
</button>

<div class="success" id="success"></div>


<!-- 报账格式 -->

<div class="section-title">
    报账格式
</div>

<div class="report-result" id="reportResult"></div>


<!-- 复制报账格式 -->

<button onclick="copyReport()">
    复制报账格式
</button>

<div class="success" id="reportSuccess"></div>


<div class="tip">
    政府补贴按原售价的5%计算，最高500元。
    商家承担政府补贴的20%，发票备注中的市补为政府补贴总额的80%。
    中台/小算盘售价 = 原售价 - 商家承担金额。
</div>

</div>


<script>


// ===============================
// 获取元素
// ===============================

const date =
    document.getElementById("date");

const model =
    document.getElementById("model");

const price =
    document.getElementById("price");

const middlePrice =
    document.getElementById("middlePrice");

const sn =
    document.getElementById("sn");

const phone =
    document.getElementById("phone");

const address =
    document.getElementById("address");

const result =
    document.getElementById("result");

const reportResult =
    document.getElementById("reportResult");

const success =
    document.getElementById("success");

const reportSuccess =
    document.getElementById("reportSuccess");


// ===============================
// 默认今天
// ===============================

const today = new Date();

const year =
    today.getFullYear();

const month =
    String(today.getMonth() + 1).padStart(2,"0");

const day =
    String(today.getDate()).padStart(2,"0");

date.value =
    `${year}-${month}-${day}`;


// ===============================
// 金额格式化
// ===============================

function formatMoney(number){

    if(!isFinite(number)){
        return "0";
    }

    number =
        Math.round(
            (number + Number.EPSILON) * 100
        ) / 100;

    if(Number.isInteger(number)){
        return number.toString();
    }

    return number
        .toFixed(2)
        .replace(/0+$/,"")
        .replace(/\.$/,"");

}


// ===============================
// 计算中台/小算盘售价
//
// 政府补贴 = 原售价 × 5%
// 最高500元
//
// 商家承担 = 政府补贴 × 20%
//
// 中台/小算盘售价
// = 原售价 - 商家承担
// ===============================

function calculateMiddlePrice(){

    const originalPrice =
        parseFloat(price.value);

    if(
        isNaN(originalPrice) ||
        originalPrice <= 0
    ){

        middlePrice.value = "";

        calc();

        return;

    }


    // 政府补贴总额
    // 5%，最高500元

    const totalGovernmentSubsidy =
        Math.min(
            originalPrice * 0.05,
            500
        );


    // 商家承担20%

    const merchantShare =
        totalGovernmentSubsidy * 0.20;


    // 中台/小算盘售价

    const calculatedMiddlePrice =
        originalPrice - merchantShare;


    middlePrice.value =
        formatMoney(calculatedMiddlePrice);


    calc();

}


// ===============================
// 生成最终备注 + 报账格式
// ===============================

function calc(){

    const originalPrice =
        parseFloat(price.value) || 0;

    const actualMiddlePrice =
        parseFloat(middlePrice.value) || 0;


    // ===============================
    // 政府补贴
    //
    // 原售价 × 5%
    // 最高500元
    // ===============================

    let totalGovernmentSubsidy = 0;

    let actualSubsidy = 0;


    if(originalPrice > 0){

        totalGovernmentSubsidy =
            Math.min(
                originalPrice * 0.05,
                500
            );


        // 发票备注中的市补
        // = 政府补贴总额 × 80%

        actualSubsidy =
            totalGovernmentSubsidy * 0.80;

    }


    // ===============================
    // 报账金额
    //
    // = 中台/小算盘售价 - 市补
    // ===============================

    let reimbursementPrice = 0;


    if(actualMiddlePrice > 0){

        reimbursementPrice =
            actualMiddlePrice - actualSubsidy;

    }


    // 防止浮点数出现极小误差

    reimbursementPrice =
        Math.round(
            (reimbursementPrice + Number.EPSILON) * 100
        ) / 100;


    // ===============================
    // 最终备注
    // ===============================

    result.innerText =
`2026年西安市消费补贴 手机 销售日期:${date.value}
SN:${sn.value}
政府补贴金额:${formatMoney(actualSubsidy)}元
补贴确认人手机号:${phone.value}
购买方地址:${address.value}`;


    // ===============================
    // 报账格式
    // ===============================

    reportResult.innerText =
`${model.value}（${formatMoney(actualMiddlePrice)}）
￥${formatMoney(reimbursementPrice)}+市补${formatMoney(actualSubsidy)}`;

}


// ===============================
// 原售价输入
// 自动计算中台/小算盘售价
// ===============================

price.addEventListener(
    "input",
    calculateMiddlePrice
);


// ===============================
// 中台/小算盘售价允许手动修改
// ===============================

middlePrice.addEventListener(
    "input",
    calc
);


// ===============================
// 其他输入实时更新
// ===============================

date.addEventListener(
    "change",
    calc
);

model.addEventListener(
    "input",
    calc
);

sn.addEventListener(
    "input",
    calc
);

phone.addEventListener(
    "input",
    calc
);

address.addEventListener(
    "input",
    calc
);


// ===============================
// 初始化
// ===============================

calc();


// ===============================
// 复制备注
// ===============================

async function copyText(){

    try{

        await navigator.clipboard.writeText(
            result.innerText
        );

        success.innerText =
            "已复制";

        setTimeout(()=>{
            success.innerText = "";
        },1500);

    }

    catch(error){

        const textarea =
            document.createElement("textarea");

        textarea.value =
            result.innerText;

        textarea.style.position =
            "fixed";

        textarea.style.opacity =
            "0";

        document.body.appendChild(
            textarea
        );

        textarea.select();

        try{

            document.execCommand("copy");

            success.innerText =
                "已复制";

        }

        catch(e){

            success.innerText =
                "复制失败，请手动复制";

        }

        document.body.removeChild(
            textarea
        );

        setTimeout(()=>{
            success.innerText = "";
        },1500);

    }

}


// ===============================
// 复制报账格式
// ===============================

async function copyReport(){

    try{

        await navigator.clipboard.writeText(
            reportResult.innerText
        );

        reportSuccess.innerText =
            "已复制";

        setTimeout(()=>{
            reportSuccess.innerText = "";
        },1500);

    }

    catch(error){

        const textarea =
            document.createElement("textarea");

        textarea.value =
            reportResult.innerText;

        textarea.style.position =
            "fixed";

        textarea.style.opacity =
            "0";

        document.body.appendChild(
            textarea
        );

        textarea.select();

        try{

            document.execCommand("copy");

            reportSuccess.innerText =
                "已复制";

        }

        catch(e){

            reportSuccess.innerText =
                "复制失败，请手动复制";

        }

        document.body.removeChild(
            textarea
        );

        setTimeout(()=>{
            reportSuccess.innerText = "";
        },1500);

    }

}

</script>

</body>

</html>
